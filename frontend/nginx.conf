server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (or any client-side routing) needs this: if the
    # user refreshes on a route like /history, there's no real file
    # at that path — nginx must fall back to index.html and let
    # React's JavaScript handle the routing client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}