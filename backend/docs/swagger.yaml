basePath: /
definitions:
  http.CalculateRequest:
    properties:
      operand_a:
        type: number
      operand_b:
        type: number
      operation:
        type: string
    type: object
  http.CalculateResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      operand_a:
        type: number
      operand_b:
        type: number
      operation:
        type: string
      result:
        type: number
    type: object
  http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  http.HistoryResponse:
    properties:
      calculations:
        items:
          $ref: '#/definitions/http.CalculateResponse'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for a full-stack calculator challenge (Sezzle SWE Intern),
    built with Go and hexagonal architecture.
  title: Calculator API
  version: "1.0"
paths:
  /calculate:
    post:
      consumes:
      - application/json
      description: Executes one operation (add, subtract, multiply, divide, power,
        sqrt, percentage) and persists the result if successful.
      parameters:
      - description: Operation and operands
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CalculateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.CalculateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Perform an arithmetic calculation
      tags:
      - calculator
  /history:
    get:
      description: Returns the most recent successful calculations (up to 20), newest
        first. Failed calculations are never persisted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.HistoryResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List recent calculations
      tags:
      - calculator
swagger: "2.0"
